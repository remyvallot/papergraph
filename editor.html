    <link rel="icon" type="image/svg+xml" href="/build-assets/logo-papergraph-DptYnSHp.svg">

</head>
<body>
    <div id="app">
        <!-- Read-Only Mode Bar (hidden by default) - positioned next to logo menu -->
        <div id="readonlyIndicator" class="readonly-bar" style="display: none;">
            <button id="copyToDashboardBtn" class="readonly-btn">
                <svg class="ui-icon ui-icon--sm" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#lock"></use></svg>
                <span>Read-only <br> Import to dashboard to edit</span>
            </button>
        </div>
        
        <!-- Logo Menu Button with integrated Project Title -->
        <div class="logo-menu-btn-extended">
            <button id="logoMenuBtnExtended" class="logo-menu-btn-part">
                <img src="data:image/svg+xml,%3csvg%20width='43'%20height='39'%20viewBox='0%200%2043%2039'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M17.9573%2035H4.375C3.47989%2035%202.62145%2034.6418%201.98851%2034.0042C1.35558%2033.3665%201%2032.5017%201%2031.6V4.4C1%203.49826%201.35558%202.63346%201.98851%201.99584C2.62145%201.35821%203.47989%201%204.375%201H16.1875L28%2012.9V26.9561'%20stroke='%232c3e50'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3cpath%20d='M16%201V13H28'%20stroke='%232c3e50'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3cline%20x1='16.9593'%20y1='24.252'%20x2='23.6069'%20y2='32.3663'%20stroke='%232c3e50'%20stroke-width='2.5'/%3e%3cline%20x1='16.9593'%20y1='24.252'%20x2='23.6069'%20y2='32.3663'%20stroke='%232c3e50'%20stroke-opacity='0.2'%20stroke-width='2.5'/%3e%3cline%20x1='34.3547'%20y1='29.8533'%20x2='28.65'%20y2='33.339'%20stroke='%232c3e50'%20stroke-width='2.5'/%3e%3cline%20x1='34.3547'%20y1='29.8533'%20x2='28.65'%20y2='33.339'%20stroke='%232c3e50'%20stroke-opacity='0.2'%20stroke-width='2.5'/%3e%3ccircle%20cx='15.1'%20cy='21.6286'%20r='3.34286'%20stroke='%232c3e50'%20stroke-width='2.5'/%3e%3ccircle%20cx='15.1'%20cy='21.6286'%20r='3.34286'%20stroke='%232c3e50'%20stroke-opacity='0.2'%20stroke-width='2.5'/%3e%3ccircle%20cx='25.9571'%20cy='34.6571'%20r='3.34286'%20stroke='%232c3e50'%20stroke-width='2.5'/%3e%3ccircle%20cx='25.9571'%20cy='34.6571'%20r='3.34286'%20stroke='%232c3e50'%20stroke-opacity='0.2'%20stroke-width='2.5'/%3e%3ccircle%20cx='37.9'%20cy='28.1429'%20r='3.34286'%20stroke='%232c3e50'%20stroke-width='2.5'/%3e%3ccircle%20cx='37.9'%20cy='28.1429'%20r='3.34286'%20stroke='%232c3e50'%20stroke-opacity='0.2'%20stroke-width='2.5'/%3e%3c/svg%3e" alt="papergraph" class="logo-icon">
                <span class="logo-text">papergraph</span>
            </button>
            
            <div class="vertical-divider"></div>
            
            <!-- Project Title (editable) -->
            <input 
                type="text" 
                id="projectTitle" 
                class="project-title-input" 
                placeholder="Untitled Project"
                maxlength="100"
            />
        </div>
        
        <!-- Header Actions (top-right) -->
        <div class="editor-header-actions">
            <button id="projectShareBtn" class="share-btn-circle" type="button" title="Share project" aria-label="Share project" style="display: none;">
                <span class="share-btn-icon" aria-hidden="true"></span>
            </button>
            <div class="user-dropdown-container editor-user-dropdown" data-include="user-dropdown"></div>
        </div>
        
        <!-- Logo Dropdown (shared partial) -->
        <div class="logo-dropdown-container" data-include="logo-dropdown"></div>
        
        <!-- Graph View -->
        <div id="graphView" class="view active">
            <!-- Article Preview Panel on the left -->
            <div id="articlePreview" class="article-preview">
                <div class="preview-content">
                    <div class="article-card">
                        <div id="previewCitationKey" class="citation-key" style="display: none;"></div>
                        <h2 id="previewTitle" class="article-title">Article Title</h2>
                        <p id="previewAuthors" class="article-meta"></p>
                        <div id="previewCategoryBadge" class="category-badge-container"></div>
                        
                        <div class="article-section">
                            <div id="previewText" class="article-description"></div>
                        </div>
                        
                        <div class="article-links">
                            <div id="previewDoiContainer" class="link-item" style="display: none;">
                                <span class="link-label">📄 DOI:</span>
                                <a id="previewDoi" href="#" target="_blank" rel="noopener"></a>
                            </div>
                            <div id="previewLinkContainer" class="link-item" style="display: none;">
                                <span class="link-label">🔗 Link:</span>
                                <a id="previewLink" href="#" target="_blank" rel="noopener"></a>
                            </div>
                            <div id="previewPdfContainer" class="link-item" style="display: none;">
                                <span class="link-label">📕 PDF:</span>
                                <a id="previewPdf" href="#" target="_blank" rel="noopener"></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="graphContainer"></div>
            
            <!-- Toolbar on the right (kept for compatibility) -->
            <div class="toolbar" style="display: none;">
            </div>
            
            <!-- Edge menu for connection actions -->
            <div id="edgeMenu" class="edge-menu">
                <button class="edge-btn edge-add-control-point" title="Add control point" data-action="add-control">
                    <svg class="ui-icon ui-icon--md" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#control-point"></use></svg>
                </button>
                <button class="edge-btn edge-edit-label" title="Edit label" data-action="edit-label">
                    <svg class="ui-icon ui-icon--md" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#edit"></use></svg>
                </button>
                <button class="edge-btn edge-delete" title="Delete connection" data-action="delete">
                    <svg class="ui-icon ui-icon--md" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#delete"></use></svg>
                </button>
            </div>
            
            <!-- Radial menu for node actions -->
            <div id="radialMenu" class="radial-menu">
                <button class="radial-btn radial-connect" title="Create connection">
                    <svg class="ui-icon ui-icon--md" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#connect"></use></svg>
                </button>
                <button class="radial-btn radial-delete" title="Delete">
                    <svg class="ui-icon ui-icon--md" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#delete"></use></svg>
                </button>
            </div>
            
            <!-- Connection mode indicator -->
            <div id="connectionModeIndicator" class="mode-indicator">
                <span>Connection mode active - Click on a target node</span>
                <button id="cancelConnectionMode">✖ Cancel</button>
            </div>

            <div id="touchZoneModeIndicator" class="mode-indicator touch-zone-mode-indicator">
                <span>Zone mode active - drag to draw a zone</span>
                <button id="cancelTouchZoneMode">✖ Cancel</button>
            </div>
        </div>

        <!-- Main Action Toolbar - Bottom horizontal (outside views to be always visible) -->
        <div class="main-toolbar">
            <button id="addArticleBtn" class="main-tool-btn" title="Add an article">
                <svg class="ui-icon ui-icon--xl" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#add"></use></svg>
                <span class="btn-label">Add</span>
            </button>
            
            <!-- Search icon/box -->
            <button id="searchToggleBtn" class="main-tool-btn search-toggle-btn">
                <svg class="ui-icon ui-icon--xl" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#search"></use></svg>
                <span class="btn-label">Search</span>
            </button>
            
            <!-- Expandable search box -->
            <div class="toolbar-search collapsed">
                <svg class="ui-icon ui-icon--sm" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#search"></use></svg>
                <input type="text" id="searchBoxToolbar" placeholder="Search..." class="toolbar-search-input">
                <span id="searchResultCount" class="search-result-count"></span>
                <button id="searchCloseBtn" class="search-close-btn">✕</button>
            </div>
            
            <!-- Graph-only buttons -->
            <div class="main-tool-divider graph-only"></div>
            <button id="fitGraphBtn" class="main-tool-btn graph-only">
                <svg class="ui-icon ui-icon--xl" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#fit-view"></use></svg>
                <span class="btn-label">Recentrer</span>
            </button>
            <button id="toggleGridBtn" class="main-tool-btn graph-only">
                <svg class="ui-icon ui-icon--xl" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#grid"></use></svg>
                <span class="btn-label">Grid</span>
            </button>
            
        </div>

        <!-- Article Edit Modal -->
        <div id="articleModal" class="modal">
            <div class="modal-content article-modal-content">
                <div class="article-modal-header">
                    <p class="article-modal-kicker">Node</p>
                    <h2 id="modalTitle">New Article</h2>
                </div>
                <form id="articleForm">
                    <div class="import-zone">
                        <div id="dropZone" class="drop-zone drop-zone-floating">
                            <div class="drop-zone-content drop-zone-content--floating">
                                <div class="prompt-surface">
                                    <label class="quick-import-entry" for="quickImport">
                                        <textarea id="quickImport" rows="1" placeholder="Paste DOI, arXiv ID, or BibTeX"></textarea>
                                    </label>
                                    <div id="importStatus" class="import-status"></div>
                                    <div class="quick-import-tools">
                                        <div class="quick-import-shortcuts">
                                            <button type="button" id="browseFileBtn" class="prompt-chip-btn">
                                                <svg class="ui-icon ui-icon--sm" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#add"></use></svg>
                                                <span>Import .bib</span>
                                            </button>
                                            <div id="manualFormToggle" class="manual-toggle manual-toggle-inline">
                                                <button type="button" id="toggleManualBtn" class="prompt-chip-btn">
                                                    <svg class="ui-icon ui-icon--sm" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#add"></use></svg>
                                                    <span>Manual entry</span>
                                                </button>
                                            </div>
                                        </div>
                                        <button type="button" id="promptActionBtn" class="prompt-action-btn" aria-label="Import or save node" title="Import metadata">
                                            <svg class="ui-icon ui-icon--md" aria-hidden="true"><use href="/build-assets/ui-sprite-CB_gvDe8.svg#chevron-right"></use></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="file" id="pdfFileInput" accept=".bib,.bibtex" style="display: none;">
                    </div>

                    <div id="manualForm" class="manual-form collapsed">
                        <div class="form-group">
                            <label for="articleTitle">Title *</label>
                            <input type="text" id="articleTitle" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="articleAuthors">Author(s)</label>
                            <input type="text" id="articleAuthors" placeholder="Doe, John and Smith, Jane">
                        </div>
                        
                        <div class="form-group">
                            <label for="articleYear">Year</label>
                            <input type="text" id="articleYear" placeholder="2024">
                        </div>
                        
                        <!-- Publication details -->
                        <div class="form-group">
                            <label for="articleType">Entry Type</label>
                            <select id="articleType">
                                <option value="article">Article (journal)</option>
                                <option value="inproceedings">Inproceedings (conference)</option>
                                <option value="book">Book</option>
                                <option value="phdthesis">PhD Thesis</option>
                                <option value="mastersthesis">Master's Thesis</option>
                                <option value="techreport">Technical Report</option>
                                <option value="misc">Misc</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="articleJournal">Journal / Conference Name</label>
                            <input type="text" id="articleJournal" placeholder="Journal or conference name">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="articleVolume">Volume</label>
                                <input type="text" id="articleVolume" placeholder="123">
                            </div>
                            <div class="form-group">
                                <label for="articleNumber">Number</label>
                                <input type="text" id="articleNumber" placeholder="4">
                            </div>
                            <div class="form-group">
                                <label for="articlePages">Pages</label>
                                <input type="text" id="articlePages" placeholder="45-67">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="articlePublisher">Publisher / Institution</label>
                            <input type="text" id="articlePublisher" placeholder="Publisher or institution name">
                        </div>
                        
                        <!-- Identifiers -->
                        <div class="form-group">
                            <label for="articleDoi">DOI</label>
                            <input type="text" id="articleDoi" placeholder="10.1234/example.2024">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="articleIsbn">ISBN</label>
                                <input type="text" id="articleIsbn" placeholder="978-3-16-148410-0">
                            </div>
                            <div class="form-group">
                                <label for="articleIssn">ISSN</label>
                                <input type="text" id="articleIssn" placeholder="1234-5678">
                            </div>
                        </div>
                        
                        <!-- Links and files -->
                        <div class="form-group">
                            <label for="articleLink">URL</label>
                            <input type="url" id="articleLink" placeholder="https://...">
                        </div>
                        
                        <div class="form-group">
                            <label for="articlePdf">PDF (URL or path)</label>
                            <input type="text" id="articlePdf" placeholder="https://... or local path">
                        </div>
                        
                        <!-- Content -->
                        <div class="form-group">
                            <label for="articleAbstract">Abstract</label>
                            <textarea id="articleAbstract" rows="4" placeholder="Article abstract..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="articleNote">Note</label>
                            <textarea id="articleNote" rows="2" placeholder="Additional notes..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="articleCategories">Keywords / Categories (comma separated)</label>
                            <input type="text" id="articleCategories" placeholder="machine learning, neural networks">
                        </div>
                    </div>

                    <div class="form-actions article-form-actions">
                        <button type="button" id="deleteArticleBtn" class="btn-danger btn-pill">Delete</button>
                        <button type="submit" id="saveArticleBtn" class="btn-primary btn-pill">Save</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Share Project Modal -->
        <div data-include="share-project-modal"></div>

        <!-- Hidden file input for import -->
        <input type="file" id="fileInput" accept=".papergraph,.json" style="display: none;">
        <input type="file" id="bibtexFileInput" accept=".bib,.bibtex" style="display: none;">
        
        <!-- Footer -->
        <div data-include="footer"></div>
        
        <!-- Preferences Modal -->
        <div data-include="preferences-modal"></div>
        
        <!-- Submit to Gallery Modal -->
        <div data-include="submit-gallery-modal"></div>
        
        <!-- New Project Modal -->
        <div data-include="new-project-modal"></div>
    
    </div>

    <!-- Application (single module entry point — Vite resolves all imports) -->
</body>
</html>
